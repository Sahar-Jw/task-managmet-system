name: Apply requested fixes v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-requested-fixes-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and commit source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          def rep(path, old, new, label):
              p=Path(path); t=p.read_text(); n=t.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 found {n}')
              p.write_text(t.replace(old,new,1)); print(label)
          def sub(path, pat, repl, label):
              p=Path(path); t=p.read_text(); out,n=re.subn(pat,repl,t,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: expected 1 found {n}')
              p.write_text(out); print(label)

          rep('frontend/src/app/dashboard/page.tsx', """          href={\n            taskListHref()\n          }\n          tone=\"red\"""", """          href={\n            taskListHref(\n              'overdueOnly=true',\n            )\n          }\n          tone=\"red\"""", 'dashboard overdue')
          rep('frontend/src/app/tasks/page.tsx', """  const [\n    overdueOnly,\n    setOverdueOnly,\n  ] = useState(false);""", """  const [\n    overdueOnly,\n    setOverdueOnly,\n  ] = useState(\n    searchParams.get(\n      'overdueOnly',\n    ) === 'true',\n  );""", 'tasks overdue url')

          sub('backend/src/modules/projects/projects.service.ts', r"""\n\n    if \(\n  query\.sortBy ===\n    'startDate' \|\|\n  query\.sortBy ===\n    'endDate'\n\) \{.*?\n\n    /\*\n     \* ========================================================\n     \* PAGINATION""", """\n\n    qb.orderBy(\n      sortBy,\n      sortDir,\n    );\n\n    if (\n      sortBy !==\n      'project.name'\n    ) {\n      qb.addOrderBy(\n        'project.name',\n        'ASC',\n      );\n    }\n\n    /*\n     * ========================================================\n     * PAGINATION""", 'project date sort')

          sub('backend/src/modules/tasks/tasks.service.ts', r"""\n\n    if \(\n  query\.sortBy ===\n    'deadline' \|\|\n  query\.sortBy ===\n    'startDate'\n\) \{.*?\n\n    qb\n      \.skip\(""", """\n\n    qb.orderBy(\n      sortColumn,\n      sortDirection,\n    );\n\n    if (\n      sortColumn !==\n      'task.createdAt'\n    ) {\n      qb.addOrderBy(\n        'task.createdAt',\n        'DESC',\n      );\n    }\n\n    qb\n      .skip(""", 'task date sort')

          rep('backend/src/modules/users/users.service.ts', """    if (\n      sortColumn !==\n      'user.fullName'\n    ) {\n      qb.addOrderBy(\n        'user.fullName',\n        'ASC',\n      );\n    }\n\n\n    qb\n      .skip(""", """    if (\n      sortColumn !==\n      'user.fullName'\n    ) {\n      qb.addOrderBy(\n        'user.fullName',\n        sortDirection,\n      );\n    }\n\n    qb.addOrderBy(\n      'user.id',\n      sortDirection,\n    );\n\n    qb\n      .skip(""", 'users sort')

          rep('backend/src/modules/users/users.service.ts', """      action:\n        AuditAction.UPDATE,\n\n      oldValue: {\n        ...oldValue,""", """      action:\n        dto.isActive !== undefined &&\n        dto.isActive !== oldValue.isActive\n          ? saved.isActive\n            ? AuditAction.ACTIVATE\n            : AuditAction.DEACTIVATE\n          : AuditAction.UPDATE,\n\n      oldValue: {\n        ...oldValue,""", 'activation audit')

          rep('backend/src/modules/users/users.service.ts', """      action:\n        AuditAction.DELETE,\n\n      oldValue: {\n        isActive:\n          true,\n      },\n\n      newValue: {\n        isActive:\n          false,\n      },""", """      action:\n        AuditAction.DEACTIVATE,\n\n      oldValue: {\n        fullName:\n          user.fullName,\n        email:\n          user.email,\n        isActive:\n          true,\n      },\n\n      newValue: {\n        fullName:\n          user.fullName,\n        email:\n          user.email,\n        isActive:\n          false,\n      },""", 'deactivation audit')

          rep('backend/src/modules/audit-logs/audit-logs.service.ts', """        .leftJoinAndSelect(\n          'log.actor',\n          'actor',\n        );\n\n\n    /*\n     * ========================================================\n     * ACTOR""", """        .leftJoinAndSelect(\n          'log.actor',\n          'actor',\n        );\n\n    qb.andWhere(\n      'log.action NOT IN (:...hiddenAccountActions)',\n      {\n        hiddenAccountActions: [\n          AuditAction.ACCOUNT_LOCKED,\n          AuditAction.ACCOUNT_UNLOCKED,\n        ],\n      },\n    );\n\n    /*\n     * ========================================================\n     * ACTOR""", 'hide lock rows')
          rep('backend/src/modules/audit-logs/audit-logs.service.ts', """      actions:\n        Object.values(\n          AuditAction,\n        ),""", """      actions:\n        Object.values(\n          AuditAction,\n        ).filter(\n          (action) =>\n            action !== AuditAction.ACCOUNT_LOCKED &&\n            action !== AuditAction.ACCOUNT_UNLOCKED,\n        ),""", 'hide lock filters')

          rep('frontend/src/app/audit-logs/page.tsx', """  AccountUnlocked: {\n    en: 'Account unlocked',\n    ar: 'فتح الحساب',\n  },\n\n  Restore: {""", """  AccountUnlocked: {\n    en: 'Account unlocked',\n    ar: 'فتح الحساب',\n  },\n\n  Activate: {\n    en: 'Activated',\n    ar: 'فعّل',\n  },\n\n  Deactivate: {\n    en: 'Deactivated',\n    ar: 'عطّل',\n  },\n\n  Restore: {""", 'audit labels')
          rep('frontend/src/app/audit-logs/page.tsx', """    case 'Create':\n    case 'Restore':\n      return 'bg-green-50 text-green-700 ring-green-100';""", """    case 'Create':\n    case 'Restore':\n    case 'Activate':\n      return 'bg-green-50 text-green-700 ring-green-100';""", 'activate style')
          rep('frontend/src/app/audit-logs/page.tsx', """    case 'Reject':\n    case 'LoginFailed':\n    case 'AccountLocked':\n      return 'bg-red-50 text-red-700 ring-red-100';""", """    case 'Reject':\n    case 'LoginFailed':\n    case 'AccountLocked':\n    case 'Deactivate':\n      return 'bg-red-50 text-red-700 ring-red-100';""", 'deactivate style')
          rep('frontend/src/app/audit-logs/page.tsx', """  const initial =\n    log.actor?.fullName\n      ?.trim()\n      .charAt(0)\n      .toUpperCase() ||\n    'S';\n\n  return (""", """  const initial =\n    log.actor?.fullName\n      ?.trim()\n      .charAt(0)\n      .toUpperCase() ||\n    'S';\n\n  const oldValue = log.oldValue ?? {};\n  const newValue = log.newValue ?? {};\n  const targetUserName =\n    log.entityType === 'User'\n      ? String(newValue.fullName || oldValue.fullName || '').trim()\n      : '';\n  const changedUserFields =\n    log.entityType === 'User' && log.action === 'Update'\n      ? Object.keys({ ...oldValue, ...newValue }).filter(\n          (key) =>\n            !['passwordHash', 'updatedAt', 'createdAt'].includes(key) &&\n            JSON.stringify(oldValue[key]) !== JSON.stringify(newValue[key]),\n        )\n      : [];\n\n  return (""", 'audit target')
          rep('frontend/src/app/audit-logs/page.tsx', """              <span className=\"font-medium text-slate-800\">\n                {entityLabel(\n                  log.entityType,\n                  isArabic,\n                )}\n              </span>""", """              <span className=\"font-medium text-slate-800\">\n                {targetUserName\n                  ? targetUserName\n                  : entityLabel(\n                      log.entityType,\n                      isArabic,\n                    )}\n              </span>\n\n              {changedUserFields.length > 0 && (\n                <span className=\"text-slate-500\">\n                  {' '}\n                  ({isArabic ? 'تم تغيير: ' : 'changed: '}\n                  {changedUserFields.join(', ')})\n                </span>\n              )}""", 'audit sentence')

          rep('backend/src/modules/tasks/dto/task.dto.ts', """  @IsOptional()\n  @IsBooleanString()\n  upcomingOnly?: string;\n\n\n  @IsOptional()\n  @IsDateString()\n  deadlineFrom?: string;""", """  @IsOptional()\n  @IsBooleanString()\n  upcomingOnly?: string;\n\n  @IsOptional()\n  @IsBooleanString()\n  overdueOnly?: string;\n\n  @IsOptional()\n  @IsDateString()\n  deadlineFrom?: string;""", 'my overdue dto')
          sub('backend/src/modules/tasks/tasks.service.ts', r"""(  if \(\n    query\.upcomingOnly ===\n      'true'\n  \) \{.*?\n  \}\n)(\n\n  if \(\n    query\.deadlineFrom)""", r"""\1\n\n  if (\n    query.overdueOnly ===\n      'true'\n  ) {\n    idQb.andWhere('task.deadlineDate IS NOT NULL')\n      .andWhere('task.deadlineDate < CURRENT_DATE')\n      .andWhere(\n        'task.status NOT IN (:...overdueDoneStatuses)',\n        { overdueDoneStatuses: [TaskStatus.COMPLETED, TaskStatus.FINISHED, TaskStatus.ARCHIVED] },\n      );\n  }\n\2""", 'my overdue backend')
          rep('frontend/src/app/tasks/mine/page.tsx', """  const [\n    upcomingOnly,\n    setUpcomingOnly,\n  ] =\n    useState(\n      false,\n    );\n\n\n  const [\n    deadlineFrom,""", """  const [\n    upcomingOnly,\n    setUpcomingOnly,\n  ] =\n    useState(\n      false,\n    );\n\n  const [\n    overdueOnly,\n    setOverdueOnly,\n  ] =\n    useState(\n      searchParams.get(\n        'overdueOnly',\n      ) === 'true',\n    );\n\n  const [\n    deadlineFrom,""", 'my overdue state')
          rep('frontend/src/app/tasks/mine/page.tsx', """          if (\n            upcomingOnly\n          ) {\n            params.upcomingOnly =\n              'true';\n          }\n\n\n          if (\n            debouncedSearch""", """          if (\n            upcomingOnly\n          ) {\n            params.upcomingOnly =\n              'true';\n          }\n\n          if (\n            overdueOnly\n          ) {\n            params.overdueOnly =\n              'true';\n          }\n\n          if (\n            debouncedSearch""", 'my overdue param')
          p=Path('frontend/src/app/tasks/mine/page.tsx'); t=p.read_text()
          t,n1=re.subn(r'(\n\s*minRating,\n\s*upcomingOnly,)(\n\s*debouncedSearch,)',r'\1\n        overdueOnly,\2',t,count=1)
          t,n2=re.subn(r'(\n\s*minRating,\n\s*upcomingOnly,)(\n\s*debouncedSearch,)',r'\1\n    overdueOnly,\2',t,count=1)
          if n1!=1 or n2!=1: raise SystemExit(f'deps {n1}/{n2}')
          p.write_text(t)
          rep('frontend/src/app/tasks/mine/page.tsx', """      minRating ||\n      upcomingOnly ||\n      deadlineFrom ||""", """      minRating ||\n      upcomingOnly ||\n      overdueOnly ||\n      deadlineFrom ||""", 'my hasFilters')
          rep('frontend/src/app/tasks/mine/page.tsx', """      upcomingOnly,\n\n      Boolean(\n        deadlineFrom ||""", """      upcomingOnly,\n\n      overdueOnly,\n\n      Boolean(\n        deadlineFrom ||""", 'my count')
          rep('frontend/src/app/tasks/mine/page.tsx', """    setUpcomingOnly(\n      false,\n    );\n\n    setDeadlineFrom(""", """    setUpcomingOnly(\n      false,\n    );\n\n    setOverdueOnly(\n      false,\n    );\n\n    setDeadlineFrom(""", 'my clear')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "fix: filters overdue navigation and detailed user activity"
          git push origin main
