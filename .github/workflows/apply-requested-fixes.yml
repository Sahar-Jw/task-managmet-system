name: Apply requested filter and audit fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-requested-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))
              print('updated', label)

          def regex_once(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(new_text)
              print('updated', label)

          # Dashboard overdue card should actually activate overdue filtering.
          replace_once(
              'frontend/src/app/dashboard/page.tsx',
              '''          href={\n            taskListHref()\n          }\n          tone="red"''',
              '''          href={\n            taskListHref(\n              'overdueOnly=true',\n            )\n          }\n          tone="red"''',
              'dashboard overdue link',
          )

          # Admin Tasks page reads overdueOnly from the URL.
          replace_once(
              'frontend/src/app/tasks/page.tsx',
              '''  const [\n    overdueOnly,\n    setOverdueOnly,\n  ] = useState(false);''',
              '''  const [\n    overdueOnly,\n    setOverdueOnly,\n  ] = useState(\n    searchParams.get(\n      'overdueOnly',\n    ) === 'true',\n  );''',
              'tasks overdue url state',
          )

          # Project date sorting - remove expression orderBy that TypeORM treats as a property path.
          regex_once(
              'backend/src/modules/projects/projects.service.ts',
              r'''\n\n    if \(\n  query\.sortBy ===\n    'startDate' \|\|\n  query\.sortBy ===\n    'endDate'\n\) \{.*?\n\n    /\*\n     \* ========================================================\n     \* PAGINATION''',
              '''\n\n    /*\n     * Sort only by mapped columns. This is safe for nullable DATE columns\n     * in MySQL/MariaDB and avoids TypeORM parsing a CASE expression.\n     */\n    qb.orderBy(\n      sortBy,\n      sortDir,\n    );\n\n\n    if (\n      sortBy !==\n      'project.name'\n    ) {\n      qb.addOrderBy(\n        'project.name',\n        'ASC',\n      );\n    }\n\n\n    /*\n     * ========================================================\n     * PAGINATION''',
              'project start/end sort',
          )

          # Task deadline/start sorting - same issue.
          regex_once(
              'backend/src/modules/tasks/tasks.service.ts',
              r'''\n\n    if \(\n  query\.sortBy ===\n    'deadline' \|\|\n  query\.sortBy ===\n    'startDate'\n\) \{.*?\n\n    qb\n      \.skip\(''',
              '''\n\n    /*\n     * Keep sorting to real mapped columns. The previous CASE expression\n     * caused TypeORM/MySQL date sort requests to fail.\n     */\n    qb.orderBy(\n      sortColumn,\n      sortDirection,\n    );\n\n\n    if (\n      sortColumn !==\n      'task.createdAt'\n    ) {\n      qb.addOrderBy(\n        'task.createdAt',\n        'DESC',\n      );\n    }\n\n\n    qb\n      .skip(''',
              'task deadline/start sort',
          )

          # User sorting - make every option deterministic and visibly stable.
          replace_once(
              'backend/src/modules/users/users.service.ts',
              '''    if (\n      sortColumn !==\n      'user.fullName'\n    ) {\n      qb.addOrderBy(\n        'user.fullName',\n        'ASC',\n      );\n    }\n\n\n    qb\n      .skip(''',
              '''    if (\n      sortColumn !==\n      'user.fullName'\n    ) {\n      qb.addOrderBy(\n        'user.fullName',\n        sortDirection,\n      );\n    }\n\n\n    qb.addOrderBy(\n      'user.id',\n      sortDirection,\n    );\n\n\n    qb\n      .skip(''',
              'users sort stability',
          )

          # Admin user update: record activate/deactivate explicitly and preserve target details.
          replace_once(
              'backend/src/modules/users/users.service.ts',
              '''      action:\n        AuditAction.UPDATE,\n\n      oldValue: {\n        ...oldValue,''',
              '''      action:\n        dto.isActive !== undefined &&\n        dto.isActive !== oldValue.isActive\n          ? saved.isActive\n            ? AuditAction.ACTIVATE\n            : AuditAction.DEACTIVATE\n          : AuditAction.UPDATE,\n\n      oldValue: {\n        ...oldValue,''',
              'admin user activate/deactivate audit action',
          )

          # Dedicated deactivate endpoint should be Deactivate, not Delete, and identify the target.
          replace_once(
              'backend/src/modules/users/users.service.ts',
              '''      action:\n        AuditAction.DELETE,\n\n      oldValue: {\n        isActive:\n          true,\n      },\n\n      newValue: {\n        isActive:\n          false,\n      },''',
              '''      action:\n        AuditAction.DEACTIVATE,\n\n      oldValue: {\n        fullName:\n          user.fullName,\n\n        email:\n          user.email,\n\n        isActive:\n          true,\n      },\n\n      newValue: {\n        fullName:\n          user.fullName,\n\n        email:\n          user.email,\n\n        isActive:\n          false,\n      },''',
              'deactivate endpoint audit detail',
          )

          # Hide account lock/unlock from normal activity results while retaining them in DB.
          replace_once(
              'backend/src/modules/audit-logs/audit-logs.service.ts',
              '''        .leftJoinAndSelect(\n          'log.actor',\n          'actor',\n        );\n\n\n    /*\n     * ========================================================\n     * ACTOR''',
              '''        .leftJoinAndSelect(\n          'log.actor',\n          'actor',\n        );\n\n\n    qb.andWhere(\n      'log.action NOT IN (:...hiddenAccountActions)',\n      {\n        hiddenAccountActions: [\n          AuditAction.ACCOUNT_LOCKED,\n          AuditAction.ACCOUNT_UNLOCKED,\n        ],\n      },\n    );\n\n\n    /*\n     * ========================================================\n     * ACTOR''',
              'hide lock unlock activity rows',
          )

          replace_once(
              'backend/src/modules/audit-logs/audit-logs.service.ts',
              '''      actions:\n        Object.values(\n          AuditAction,\n        ),''',
              '''      actions:\n        Object.values(\n          AuditAction,\n        ).filter(\n          (action) =>\n            action !==\n              AuditAction.ACCOUNT_LOCKED &&\n            action !==\n              AuditAction.ACCOUNT_UNLOCKED,\n        ),''',
              'hide lock unlock action filter options',
          )

          # Activity log frontend action labels/styles.
          replace_once(
              'frontend/src/app/audit-logs/page.tsx',
              '''  AccountUnlocked: {\n    en: 'Account unlocked',\n    ar: 'فتح الحساب',\n  },\n\n  Restore: {''',
              '''  AccountUnlocked: {\n    en: 'Account unlocked',\n    ar: 'فتح الحساب',\n  },\n\n  Activate: {\n    en: 'Activated',\n    ar: 'فعّل',\n  },\n\n  Deactivate: {\n    en: 'Deactivated',\n    ar: 'عطّل',\n  },\n\n  Restore: {''',
              'activity action labels',
          )

          replace_once(
              'frontend/src/app/audit-logs/page.tsx',
              '''    case 'Create':\n    case 'Restore':\n      return 'bg-green-50 text-green-700 ring-green-100';''',
              '''    case 'Create':\n    case 'Restore':\n    case 'Activate':\n      return 'bg-green-50 text-green-700 ring-green-100';''',
              'activity activate style',
          )

          replace_once(
              'frontend/src/app/audit-logs/page.tsx',
              '''    case 'Reject':\n    case 'LoginFailed':\n    case 'AccountLocked':\n      return 'bg-red-50 text-red-700 ring-red-100';''',
              '''    case 'Reject':\n    case 'LoginFailed':\n    case 'AccountLocked':\n    case 'Deactivate':\n      return 'bg-red-50 text-red-700 ring-red-100';''',
              'activity deactivate style',
          )

          # Detailed target-aware activity sentence for User records.
          replace_once(
              'frontend/src/app/audit-logs/page.tsx',
              '''  const initial =\n    log.actor?.fullName\n      ?.trim()\n      .charAt(0)\n      .toUpperCase() ||\n    'S';\n\n  return (''',
              '''  const initial =\n    log.actor?.fullName\n      ?.trim()\n      .charAt(0)\n      .toUpperCase() ||\n    'S';\n\n\n  const oldValue =\n    log.oldValue ??\n    {};\n\n  const newValue =\n    log.newValue ??\n    {};\n\n  const targetUserName =\n    log.entityType === 'User'\n      ? String(\n          newValue.fullName ||\n          oldValue.fullName ||\n          '',\n        ).trim()\n      : '';\n\n  const changedUserFields =\n    log.entityType === 'User' &&\n    log.action === 'Update'\n      ? Object.keys({\n          ...oldValue,\n          ...newValue,\n        }).filter(\n          (key) =>\n            key !== 'passwordHash' &&\n            JSON.stringify(\n              oldValue[key],\n            ) !==\n              JSON.stringify(\n                newValue[key],\n              ),\n        )\n      : [];\n\n  return (''',
              'activity target details state',
          )

          replace_once(
              'frontend/src/app/audit-logs/page.tsx',
              '''              <span>\n                {actionLabel(\n                  log.action,\n                  isArabic,\n                )}\n              </span>\n\n              {' '}\n\n              <span className="font-medium text-slate-800">\n                {entityLabel(\n                  log.entityType,\n                  isArabic,\n                )}\n              </span>''',
              '''              <span>\n                {actionLabel(\n                  log.action,\n                  isArabic,\n                )}\n              </span>\n\n              {' '}\n\n              <span className="font-medium text-slate-800">\n                {targetUserName\n                  ? targetUserName\n                  : entityLabel(\n                      log.entityType,\n                      isArabic,\n                    )}\n              </span>\n\n              {changedUserFields.length > 0 && (\n                <span className="text-slate-500">\n                  {' '}\n                  (\n                  {isArabic\n                    ? 'تم تغيير: '\n                    : 'changed: '}\n                  {changedUserFields.join(', ')}\n                  )\n                </span>\n              )}''',
              'activity detailed main sentence',
          )

          # Non-admin dashboard overdue needs My Tasks API support too.
          replace_once(
              'backend/src/modules/tasks/dto/task.dto.ts',
              '''  @IsOptional()\n  @IsBooleanString()\n  upcomingOnly?: string;\n\n\n  @IsOptional()\n  @IsDateString()\n  deadlineFrom?: string;''',
              '''  @IsOptional()\n  @IsBooleanString()\n  upcomingOnly?: string;\n\n\n  @IsOptional()\n  @IsBooleanString()\n  overdueOnly?: string;\n\n\n  @IsOptional()\n  @IsDateString()\n  deadlineFrom?: string;''',
              'my tasks overdue dto',
          )

          regex_once(
              'backend/src/modules/tasks/tasks.service.ts',
              r'''(  if \(\n    query\.upcomingOnly ===\n      'true'\n  \) \{.*?\n  \}\n)(\n\n  if \(\n    query\.deadlineFrom)''',
              r'''\1\n\n  if (\n    query.overdueOnly ===\n      'true'\n  ) {\n    idQb\n      .andWhere(\n        'task.deadlineDate IS NOT NULL',\n      )\n      .andWhere(\n        'task.deadlineDate < CURRENT_DATE',\n      )\n      .andWhere(\n        'task.status NOT IN (:...overdueDoneStatuses)',\n        {\n          overdueDoneStatuses: [\n            TaskStatus.COMPLETED,\n            TaskStatus.FINISHED,\n            TaskStatus.ARCHIVED,\n          ],\n        },\n      );\n  }\n\2''',
              'my tasks overdue backend filter',
          )

          replace_once(
              'frontend/src/app/tasks/mine/page.tsx',
              '''  const [\n    upcomingOnly,\n    setUpcomingOnly,\n  ] =\n    useState(\n      false,\n    );\n\n\n  const [\n    deadlineFrom,''',
              '''  const [\n    upcomingOnly,\n    setUpcomingOnly,\n  ] =\n    useState(\n      false,\n    );\n\n\n  const [\n    overdueOnly,\n    setOverdueOnly,\n  ] =\n    useState(\n      searchParams.get(\n        'overdueOnly',\n      ) === 'true',\n    );\n\n\n  const [\n    deadlineFrom,''',
              'my tasks overdue frontend state',
          )

          replace_once(
              'frontend/src/app/tasks/mine/page.tsx',
              '''          if (\n            upcomingOnly\n          ) {\n            params.upcomingOnly =\n              'true';\n          }\n\n\n          if (\n            debouncedSearch''',
              '''          if (\n            upcomingOnly\n          ) {\n            params.upcomingOnly =\n              'true';\n          }\n\n\n          if (\n            overdueOnly\n          ) {\n            params.overdueOnly =\n              'true';\n          }\n\n\n          if (\n            debouncedSearch''',
              'my tasks send overdue',
          )

          p = Path('frontend/src/app/tasks/mine/page.tsx')
          t = p.read_text()
          t2, n = re.subn(r'(\n\s*minRating,\n\s*upcomingOnly,)(\n\s*debouncedSearch,)', r'\1\n        overdueOnly,\2', t, count=1)
          if n != 1:
              raise SystemExit(f'my tasks callback deps: found {n}')
          t = t2
          t2, n = re.subn(r'(\n\s*minRating,\n\s*upcomingOnly,)(\n\s*debouncedSearch,)', r'\1\n    overdueOnly,\2', t, count=1)
          if n != 1:
              raise SystemExit(f'my tasks reset deps: found {n}')
          p.write_text(t2)

          replace_once(
              'frontend/src/app/tasks/mine/page.tsx',
              '''      minRating ||\n      upcomingOnly ||\n      deadlineFrom ||''',
              '''      minRating ||\n      upcomingOnly ||\n      overdueOnly ||\n      deadlineFrom ||''',
              'my tasks has filters overdue',
          )

          replace_once(
              'frontend/src/app/tasks/mine/page.tsx',
              '''      upcomingOnly,\n\n      Boolean(\n        deadlineFrom ||''',
              '''      upcomingOnly,\n\n      overdueOnly,\n\n      Boolean(\n        deadlineFrom ||''',
              'my tasks filter count overdue',
          )

          replace_once(
              'frontend/src/app/tasks/mine/page.tsx',
              '''    setUpcomingOnly(\n      false,\n    );\n\n    setDeadlineFrom(''',
              '''    setUpcomingOnly(\n      false,\n    );\n\n    setOverdueOnly(\n      false,\n    );\n\n    setDeadlineFrom(''',
              'my tasks clear overdue',
          )

          print('all requested source edits applied')
          PY

      - name: Verify backend build
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "fix: filters overdue navigation and detailed user activity"
          git push origin main
