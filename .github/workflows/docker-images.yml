name: Build and push Docker images

# Builds both images on GitHub's servers and pushes them to Docker Hub.
# Run it from the repo's "Actions" tab (Run workflow) or by pushing to main.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub username
#   DOCKERHUB_TOKEN     - a Docker Hub access token with Read & Write permission

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tm-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tm-backend:${{ github.run_number }}

      # The API URLs default to https://api.dcc.sy in frontend/Dockerfile.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tm-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tm-frontend:${{ github.run_number }}
