name: Repair lockfile and verify builds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-lock-and-build.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify frontend clean install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify backend clean install and build
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git commit -m "fix: synchronize frontend package lock"
            git push origin main
          fi
