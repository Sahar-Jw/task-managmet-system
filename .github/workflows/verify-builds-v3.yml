name: Verify builds after compatibility fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-builds-v3.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix legacy branches page API call
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/branches/page.tsx')
          t = p.read_text()
          t = t.replace("  BranchesApi,\n  DepartmentsApi,\n", "  BranchesApi,\n  DepartmentsApi,\n  SettingsApi,\n", 1)
          t = t.replace("      await BranchesApi.update(\n        branch.id,", "      await SettingsApi.update(\n        branch.id,", 1)
          p.write_text(t)
          PY

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/branches/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: use settings update for branch activation"
            git push origin main
          fi

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run build
