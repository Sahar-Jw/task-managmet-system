server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets: cache for a year
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PDF preview worker must be served as JavaScript
    location = /pdf.worker.min.mjs {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Pages are exported as /<route>/index.html (trailingSlash: true).
    # HTML is never cached so a redeploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
